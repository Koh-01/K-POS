<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>K POS — Create account</title>
  <link rel="icon" type="image/png" href="/static/images/favicon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>body{background:#0f172a;min-height:100vh;padding:2rem 0}</style>
</head>
<body class="d-flex align-items-center">
<main class="container" style="max-width:520px">
  <div class="text-center mb-4 text-white">
    <img src="/static/images/k_pos_logo.png" width="80" height="80" class="rounded-3" alt="K POS logo">
    <h3 class="mt-3 fw-bold">Start with K POS</h3>
    <p class="text-secondary mb-0">Create the first Admin account for your restaurant</p>
  </div>
  <div class="card border-0 shadow-lg"><div class="card-body p-4">
    {% if error %}<div class="alert alert-danger small"><i class="bi bi-exclamation-triangle me-1"></i>{{ error }}</div>{% endif %}
    {% if success %}
      <div class="alert alert-success mb-3"><i class="bi bi-envelope-check me-1"></i>{{ success }}</div>
      <a class="btn btn-outline-primary w-100" href="/web/login">Back to Sign In</a>
      {% if email %}
      <form method="post" action="/web/resend-verification" class="mt-2">
        <input type="hidden" name="email" value="{{ email }}">
        <button class="btn btn-link w-100 small" type="submit">Resend verification email</button>
      </form>
      {% endif %}
    {% else %}
    <form method="post" action="/web/register">
      <div class="mb-3"><label class="form-label fw-semibold">Restaurant name</label><input class="form-control" name="restaurant_name" value="{{ restaurant_name or '' }}" required minlength="2" maxlength="150"></div>
      <div class="mb-3"><label class="form-label fw-semibold">Your full name</label><input class="form-control" name="full_name" value="{{ full_name or '' }}" required minlength="2" maxlength="100" autocomplete="name"></div>
      <div class="mb-3"><label class="form-label fw-semibold">Email</label><input class="form-control" name="email" type="email" value="{{ email or '' }}" required maxlength="254" autocomplete="email"></div>
      <div class="row g-3 mb-4">
        <div class="col-sm-6"><label class="form-label fw-semibold">Password</label><input class="form-control" name="password" type="password" required minlength="8" autocomplete="new-password"></div>
        <div class="col-sm-6"><label class="form-label fw-semibold">Confirm password</label><input class="form-control" name="confirm_password" type="password" required minlength="8" autocomplete="new-password"></div>
      </div>
      <button class="btn btn-primary w-100" type="submit"><i class="bi bi-person-check me-1"></i>Create account</button>
    </form>
    <p class="text-center small text-muted mt-3 mb-0">Already registered? <a href="/web/login">Sign in</a></p>
    {% endif %}
  </div></div>
</main>
</body>
</html>
