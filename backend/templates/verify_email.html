<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>K POS — Email verification</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body{background:#0f172a;min-height:100vh}</style>
</head>
<body class="d-flex align-items-center">
  <main class="container" style="max-width:460px"><div class="card border-0 shadow-lg"><div class="card-body p-5 text-center">
    <div class="text-danger fs-1 mb-2">!</div>
    <h4>Email verification failed</h4>
    <p class="text-muted">{{ error }}</p>
    <a class="btn btn-primary" href="/web/register">Return to registration</a>
  </div></div></main>
</body>
</html>
