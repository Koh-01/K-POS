<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>K POS — Login</title>
  <link rel="icon" type="image/png" href="/static/images/favicon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #0f172a; min-height: 100vh; display: flex; align-items: center; }
  </style>
</head>
<body>
<div class="container" style="max-width:400px">
  <div class="text-center mb-4">
    <img src="/static/images/k_pos_logo.png" width="96" height="96" class="rounded-3" alt="K POS logo">
    <h4 class="text-white mt-2 fw-bold">K POS</h4>
    <p class="text-secondary small">Admin accounts only</p>
  </div>

  <div class="card shadow-lg border-0">
    <div class="card-body p-4">
      {% if error %}
      <div class="alert alert-danger py-2 small">
        <i class="bi bi-exclamation-triangle me-1"></i>{{ error }}
      </div>
      {% endif %}
      {% if verified %}
      <div class="alert alert-success py-2 small">
        <i class="bi bi-check-circle me-1"></i>Email verified. Your admin account is ready.
      </div>
      {% endif %}

      <form method="post" action="/web/login">
        <div class="mb-3">
          <label class="form-label fw-semibold">Email</label>
          <input name="username" type="text" class="form-control" autofocus autocomplete="username" required placeholder="admin@example.com">
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Password</label>
          <input name="password" type="password" class="form-control" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">
          <i class="bi bi-box-arrow-in-right me-1"></i>Sign In
        </button>
      </form>
      <hr class="my-4">
      <p class="text-center small text-muted mb-0">
        Opening a new restaurant? <a href="/web/register">Create an admin account</a>
      </p>
    </div>
  </div>
</div>
</body>
</html>
