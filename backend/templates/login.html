<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>POS Admin — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #0f172a; min-height: 100vh; display: flex; align-items: center; }
  </style>
</head>
<body>
<div class="container" style="max-width:400px">
  <div class="text-center mb-4">
    <i class="bi bi-shop text-primary" style="font-size:2.5rem"></i>
    <h4 class="text-white mt-2 fw-bold">POS Admin</h4>
    <p class="text-secondary small">Admin accounts only</p>
  </div>

  <div class="card shadow-lg border-0">
    <div class="card-body p-4">
      {% if error %}
      <div class="alert alert-danger py-2 small">
        <i class="bi bi-exclamation-triangle me-1"></i>{{ error }}
      </div>
      {% endif %}

      <form method="post" action="/web/login">
        <div class="mb-3">
          <label class="form-label fw-semibold">Username</label>
          <input name="username" type="text" class="form-control" autofocus autocomplete="username" required>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Password</label>
          <input name="password" type="password" class="form-control" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">
          <i class="bi bi-box-arrow-in-right me-1"></i>Sign In
        </button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
