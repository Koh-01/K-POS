name: pos_app
description: "K POS - Restaurant Point of Sale System"
publish_to: 'none'

version: 1.0.3+4

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # HTTP client
  dio: ^5.8.0+1

  # Local database
  sqflite: ^2.4.1
  path: ^1.9.1

  # Routing
  go_router: ^14.8.1

  # Secure storage (JWT token)
  flutter_secure_storage: ^9.2.4

  # Images
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Formatting
  intl: ^0.20.2

  # PDF receipts
  pdf: ^3.11.3
  printing: ^5.14.2

  # Connectivity / offline detection
  connectivity_plus: ^6.1.4

  # Non-sensitive preferences (theme, printer MAC, base URL)
  shared_preferences: ^2.3.5

  # Bluetooth thermal printer (Android SPP)
  blue_thermal_printer: ^1.1.2

  # File / share
  path_provider: ^2.1.5
  web: ^1.1.1

  # UUID for offline order refs
  uuid: ^4.5.1

  # Charts
  fl_chart: ^0.70.2

dependency_overrides:
  printing:
    path: packages/printing

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
